name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build seed compiler
        run: |
          cd seed
          gcc -I src -std=c11 -Wall -Wextra -O2 -D_POSIX_C_SOURCE=200809L src/*.c -o kodas -lm
      - name: Run tests
        run: |
          cd seed
          ./kodas run ../tests/hello.kds
          ./kodas run ../tests/math.kds
          ./kodas run ../tests/features.kds

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build seed compiler
        run: |
          cd seed
          clang -I src -std=c11 -Wall -Wextra -O2 src/*.c -o kodas -lm
      - name: Run tests
        run: |
          cd seed
          ./kodas run ../tests/hello.kds
          ./kodas run ../tests/features.kds

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build seed compiler
        run: |
          cd seed
          cl /Isrc /std:c11 /O2 src\*.c /Fe:kodas.exe
      - name: Run tests
        run: |
          cd seed
          kodas.exe run ..\tests\hello.kds
          kodas.exe run ..\tests\features.kds
